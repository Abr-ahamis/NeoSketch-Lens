services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    env_file:
      - ../server/.env
    environment:
      BEACON_DB_PATH: /data/beacons.sqlite3
    volumes:
      - beacon_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  beacon_data:
  caddy_data:
  caddy_config:
